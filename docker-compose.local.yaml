name: hacknation-local

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: hacknation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hacknation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hacknation}
      POSTGRES_DB: ${POSTGRES_DB:-hacknation}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
    name: hacknation-postgres-data
